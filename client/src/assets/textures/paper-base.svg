<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="paperFiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.65" numOctaves="5" seed="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="fiber">
        <feFuncA type="table" tableValues="0 0.04 0.06 0.03"/>
      </feComponentTransfer>
      <feComposite in="fiber" in2="SourceGraphic" operator="in" result="masked"/>
    </filter>
    <radialGradient id="paperLight" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fcf8f2" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f7f0e4" stop-opacity="1"/>
      <stop offset="65%" stop-color="#f0e6d5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e8dcc8" stop-opacity="1"/>
    </radialGradient>
    <filter id="fibers">
      <feTurbulence type="turbulence" baseFrequency="0.04 0.08" numOctaves="3" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#paperLight)"/>
  <rect width="600" height="600" fill="#d4c8b0" opacity="0.06" filter="url(#paperFiber)"/>
  <rect width="600" height="600" filter="url(#fibers)" opacity="0">
    <animate attributeName="opacity" values="0" dur="1s"/>
  </rect>
</svg>
