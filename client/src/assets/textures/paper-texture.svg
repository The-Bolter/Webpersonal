<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="watercolorTex">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="6" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="texture">
        <feFuncA type="table" tableValues="0 0.05 0.10 0.15 0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#c8b898" opacity="0.15" filter="url(#watercolorTex)"/>
</svg>
