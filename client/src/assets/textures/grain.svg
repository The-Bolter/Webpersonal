<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="grainFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="12" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="grain">
        <feFuncA type="table" tableValues="0 0.03 0.05 0.04 0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#8a8a8a" opacity="0.08" filter="url(#grainFilter)"/>
</svg>
